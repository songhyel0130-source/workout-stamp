<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동 스탬프</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운동 스탬프">
<meta name="theme-color" content="#0f6e56">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1f1f1d; --sub: #6b6a66; --line: #e4e2db;
    --accent: #0f6e56; --accent-soft: #e1f5ee; --stamp: #5dcaa5; --cell: #eeece6; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1f1f1d; --text: #f1efe8; --sub: #a3a199; --line: #34332f;
      --accent: #5dcaa5; --accent-soft: #0b3a2e; --stamp: #1d9e75; --cell: #2a2926; --danger: #f09595; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; }
  .app { max-width: 440px; margin: 0 auto; padding: 20px 16px 96px; min-height: 100vh; }
  h1 { font-size: 20px; font-weight: 700; }
  h2 { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12px; color: var(--sub); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .card > h2, .card > .row-between { margin-bottom: 10px; }
  .row-between { display: flex; justify-content: space-between; align-items: baseline; }
  button { font: inherit; color: inherit; border: 1px solid var(--line); background: transparent; border-radius: 10px;
    padding: 9px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 700; }
  button.small { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .summary { display: flex; gap: 16px; align-items: center; }
  .summary .big { font-size: 17px; font-weight: 700; }
  .fire { font-size: 40px; line-height: 1; }
  .fire.off { filter: grayscale(1); opacity: .45; }
  .streak-n { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .today-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; cursor: pointer; }
  .today-item + .today-item { border-top: 1px solid var(--line); }
  .thumb { width: 72px; height: 41px; border-radius: 6px; object-fit: cover; background: var(--cell); flex-shrink: 0; cursor: pointer; }
  .title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title2 { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .grow { flex: 1; min-width: 0; }
  .today-item button { flex-shrink: 0; min-width: 48px; }
  .today-item button.checked { background: var(--cell); border-color: transparent; color: var(--sub); font-weight: 700; cursor: default; }
  .badge.mute { background: var(--line); color: var(--sub, #777); }
  .badge { font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 9px; }
  .days, .cells { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .days span { text-align: center; font-size: 11px; color: var(--sub); }
  .days span.now { color: var(--text); font-weight: 700; }
  .vrow { margin-top: 12px; }
  .vrow .meta { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .cell { height: 30px; border-radius: 7px; background: var(--cell); border: none; padding: 0; color: #04342c; font-size: 14px; font-weight: 700; }
  .cell.on { background: var(--stamp); }
  .cell.on.prev { background: var(--cell); color: var(--sub); font-weight: 400; }
  .cell.today { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .cell:disabled { cursor: default; }
  .cell.future { opacity: .45; }
  .empty { text-align: center; padding: 18px 0 6px; }
  .empty p { margin-bottom: 12px; color: var(--sub); font-size: 13px; }
  .section { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 8px; }
  .vcard { cursor: pointer; }
  .vcard .top { display: flex; gap: 10px; align-items: center; }
  .vcard .thumb { width: 96px; height: 54px; }
  .chev { color: var(--sub); font-size: 20px; }
  .back { border: none; padding: 4px 0; color: var(--sub); margin-bottom: 10px; }
  .hero { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--cell); cursor: pointer; margin-bottom: 10px; }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dtitle { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .setrow { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 14px; }
  .setrow + .setrow { border-top: 1px solid var(--line); }
  .step { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; }
  .stats { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat { flex: 1; background: var(--bg); border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 17px; }
  .calhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
  .cday { aspect-ratio: 1; border-radius: 50%; border: none; padding: 0; font-size: 13px; background: transparent; }
  .cday.on { background: var(--stamp); color: #04342c; font-weight: 700; }
  .cday.today { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .cday:disabled { cursor: default; color: inherit; }
  .cday.future { opacity: .35; }
  .cday.inp:not(.on) { background: var(--cell); }
  .pill { font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 9px; font-weight: 700; }
  button.danger { color: var(--danger); width: 100%; }
  .bar { height: 6px; border-radius: 3px; background: var(--cell); overflow: hidden; margin: 6px 0 4px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--stamp); }
  input[type=url] { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; }
  .err { color: var(--danger); font-size: 12px; min-height: 18px; margin-top: 4px; }
  .stepper { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; }
  .stepper b { min-width: 52px; text-align: center; }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); z-index: 5; }
  nav .in { max-width: 440px; margin: 0 auto; display: flex; }
  nav button { flex: 1; border: none; border-radius: 0; padding: 14px 0 18px; font-size: 13px; color: var(--sub); }
  nav button.cur { color: var(--accent); font-weight: 700; }
  #player-view { position: fixed; inset: 0; background: var(--bg); z-index: 10; overflow: auto; }
  #player-view .inner { max-width: 440px; margin: 0 auto; padding: 16px; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; margin: 12px 0; }
  .frame iframe, .frame > div { position: absolute; inset: 0; width: 100%; height: 100%; }
  .notice { font-size: 13px; background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .notice a { color: inherit; font-weight: 700; }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    font-size: 13px; padding: 10px 16px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 15; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .sheet-in { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px 16px; width: 100%; max-width: 360px; text-align: center; }
  .sheet-in .emoji { font-size: 40px; line-height: 1; margin-bottom: 8px; }
  .sheet-in h2 { font-size: 18px; margin-bottom: 8px; }
  .sheet-in .sub { margin: 4px 0 16px; }
  .sheet-in button { width: 100%; margin-top: 8px; }
  .sheet-in button.ghost { border-color: transparent; color: var(--sub); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="head"><h1 id="page-title">운동 스탬프</h1><span class="sub" id="week-range"></span></div>
  <div id="view"></div>
</div>

<nav><div class="in">
  <button data-act="tab" data-tab="home" id="nav-home">홈</button>
  <button data-act="tab" data-tab="videos" id="nav-videos">영상</button>
</div></nav>

<div id="player-view" hidden>
  <div class="inner">
    <div class="row-between"><h2 class="title grow" id="p-title"></h2><button id="p-close">닫기</button></div>
    <div class="frame"><div id="yt"></div></div>
    <div class="notice" id="p-error" hidden>이 영상은 앱 안에서 재생할 수 없어요. <a id="p-link" target="_blank" rel="noopener">유튜브에서 본 뒤</a> "다 했어요"를 눌러 주세요.</div>
    <div class="sub" id="p-progress">80% 이상 보면 스탬프가 찍혀요</div>
    <div class="bar"><i id="p-bar"></i></div>
    <button id="p-manual" style="width:100%;margin-top:10px">다 했어요</button>
  </div>
</div>

<div id="sheet" hidden><div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="s-head">
  <div class="emoji" aria-hidden="true">🎉</div>
  <h2 id="s-head">루틴 달성!</h2>
  <div class="title2" id="s-title"></div>
  <div class="sub" id="s-line"></div>
  <button class="primary" data-act="ach-restart">새 목표로 다시 시작</button>
  <button data-act="ach-archive">보관함으로</button>
  <button class="ghost" data-act="ach-later">나중에</button>
</div></div>

<div id="toast"></div>

<script>
const KEY = 'workout-stamp-1bolt';
const MAX_ROUTINE = 5;
const DAY_NAMES = ['월', '화', '수', '목', '금', '토', '일'];
let state = load();
let tab = 'home';
let adding = false;
let addTarget = 3;
let addWeeks = 4;
let addUrl = '';
let addStart = null;
let detailId = null;
let calMonth = new Date();

function load() {
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!s || !Array.isArray(s.videos) || !Array.isArray(s.logs)) s = { videos: [], logs: [] };
  const today = ymd(new Date());
  s.videos.forEach(v => {
    if (v.run !== undefined) return;
    if (v.routine === undefined) v.routine = true;
    if (!v.past) v.past = [];
    if (!v.weeks) {
      v.weeks = 4; v.start = null; v.wt = [];
      if (v.routine) {
        v.start = mondayOf(new Date(v.addedAt || Date.now()));
        if (addDays(v.start, 27) < today) v.start = mondayOf(new Date());
        v.wt = Array(4).fill(v.target);
      }
    }
    v.past.forEach(p => { if (!p.result) p.result = p.done >= p.goal ? 'done' : 'short'; if (!p.end) p.end = addDays(p.start, p.weeks * 7 - 1); });
    v.run = null;
    if (v.start && v.wt && v.wt.length) {
      const end = addDays(v.start, v.wt.length * 7 - 1);
      const g = v.wt.reduce((a, b) => a + b, 0);
      const done = new Set(s.logs.filter(l => l.vid === v.id && l.date >= v.start && l.date <= end).map(l => l.date)).size;
      if (today > end) v.past.push({ start: v.start, end, weeks: v.wt.length, goal: g, done, result: done >= g ? 'done' : 'short' });
      else if (!v.routine) v.past.push({ start: v.start, end: today, weeks: v.wt.length, goal: g, done, result: 'stopped' });
      else v.run = { start: v.start, wt: v.wt };
    }
    delete v.routine; delete v.start; delete v.wt;
  });
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function mondayOf(d) { return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7))); }
function toUTC(s) { const a = s.split('-').map(Number); return Date.UTC(a[0], a[1] - 1, a[2]); }
function addDays(s, n) { const d = new Date(toUTC(s) + n * 864e5); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }
function md(s) { return s.slice(5).replace('-', '.'); }
function periodEnd(v) { return addDays(v.run.start, v.run.wt.length * 7 - 1); }
function weekIdx(v) { return Math.round((toUTC(mondayOf(new Date())) - toUTC(v.run.start)) / (7 * 864e5)); }
function tgt(v) { return v.run ? v.run.wt[Math.max(0, Math.min(v.run.wt.length - 1, weekIdx(v)))] : v.target; }
function goal(v) { return v.run.wt.reduce((a, b) => a + b, 0); }
function periodCount(v) {
  const e = periodEnd(v);
  const lo = v.run.from || v.run.start;
  return new Set(state.logs.filter(l => l.vid === v.id && l.date >= lo && l.date <= e).map(l => l.date)).size;
}
function isAchieved(v) { return !!v.run && periodCount(v) >= goal(v); }
function startRun(v) {
  const mon = mondayOf(new Date()), lp = v.past[v.past.length - 1];
  v.run = { start: mon, wt: Array(v.weeks).fill(v.target) };
  // 같은 주에 끝난 이전 루틴이 있으면, 그 루틴이 끝난 날까지의 스탬프는 새 루틴에 세지 않는다
  if (lp && lp.end >= mon) v.run.from = addDays(lp.end, 1);
}
function endRun(v, result) {
  const done = periodCount(v), g = goal(v);
  v.past.push({ start: v.run.start, end: result === 'stopped' ? ymd(new Date()) : periodEnd(v), weeks: v.run.wt.length, goal: g, done, result: done >= g ? 'done' : (result || 'short') });
  v.run = null;
}
function expire() {
  let changed = false;
  state.videos.forEach(v => { if (v.run && ymd(new Date()) > periodEnd(v)) { endRun(v); changed = true; } });
  if (changed) save();
}
function pastLine(p) {
  return p.result === 'done' ? '달성 · ' + p.done + '/' + p.goal + '회' : p.result === 'stopped' ? '중단 · ' + p.goal + '회 중 ' + p.done + '회' : p.goal + '회 중 ' + p.done + '회 · 종료';
}
function periodLine(v) {
  if (!v.run) return v.past.length ? pastLine(v.past[v.past.length - 1]) : '';
  const done = periodCount(v), g = goal(v);
  return done + '/' + g + '회 · ' + (weekIdx(v) + 1) + '주차/' + v.run.wt.length + '주' + (done >= g ? ' · 달성' : '');
}
function weekDates() {
  const now = new Date();
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  return DAY_NAMES.map((_, i) => ymd(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i)));
}
function weekCount(vid) {
  const w = weekDates();
  const v = state.videos.find(x => x.id === vid);
  const lo = v && v.run && v.run.from && v.run.from > w[0] ? v.run.from : w[0];
  return new Set(state.logs.filter(l => l.vid === vid && l.date >= lo && l.date <= w[6]).map(l => l.date)).size;
}
function totalCount(vid) { return new Set(state.logs.filter(l => l.vid === vid).map(l => l.date)).size; }
function doneOn(vid, date) { return state.logs.some(l => l.vid === vid && l.date === date); }
function lastDate(vid) {
  const d = state.logs.filter(l => l.vid === vid).map(l => l.date).sort().pop();
  return d ? d.slice(5).replace('-', '.') : null;
}
function routine() { return state.videos.filter(v => v.run); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function thumb(id) { return 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg'; }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function parseId(url) {
  const m = String(url).trim().match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
async function fetchTitle(id) {
  const target = 'https://www.youtube.com/watch?v=' + id;
  const sources = ['https://www.youtube.com/oembed?format=json&url=', 'https://noembed.com/embed?url='];
  for (const src of sources) {
    try {
      const r = await fetch(src + encodeURIComponent(target));
      if (!r.ok) continue;
      const j = await r.json();
      if (j && j.title) return j.title;
    } catch (e) {}
  }
  return '제목 없는 영상';
}
function addLog(vid, src, date) {
  date = date || ymd(new Date());
  if (doneOn(vid, date)) return false;
  state.logs.push({ vid, date, ts: Date.now(), src });
  save();
  return true;
}

function streak() {
  const today = ymd(new Date());
  const dates = [...new Set(state.logs.map(l => l.date))].filter(d => d <= today).sort();
  if (!dates.length) return { n: 0, never: true };
  const gap = Math.round((toUTC(today) - toUTC(dates[dates.length - 1])) / 864e5);
  if (gap > 7) return { n: 0 };
  let n = 1;
  for (let i = dates.length - 1; i > 0; i--) {
    if ((toUTC(dates[i]) - toUTC(dates[i - 1])) / 864e5 > 7) break;
    n++;
  }
  return { n, today: gap === 0, left: 7 - gap };
}

function streakCard(right) {
  const sk = streak();
  const skMsg = sk.never ? '첫 스탬프를 찍으면 시작돼요' : sk.n === 0 ? '기록이 끊겼어요. 오늘 다시 시작해요'
    : sk.today ? '오늘도 이어갔어요' : sk.left === 0 ? '오늘 운동해야 이어져요' : sk.left + '일 안에 운동하면 이어져요';
  return '<div class="card"><div class="summary"><div class="fire' + (sk.n ? '' : ' off') + '" aria-hidden="true">🔥</div>'
    + '<div class="grow"><div class="streak-n">' + sk.n + '일</div><div class="sub">' + skMsg + '</div></div>' + (right || '') + '</div></div>';
}

function renderHome() {
  const w = weekDates();
  const today = ymd(new Date());
  const list = routine();
  if (state.videos.length === 0) {
    return (state.logs.length ? streakCard() : '') + '<div class="card"><div class="empty"><p>이번 주에 할 운동 영상을 등록해 보세요.</p><button class="primary" data-act="go-add">첫 영상 추가</button></div></div>';
  }
  if (list.length === 0) {
    return streakCard() + '<div class="card"><div class="empty"><p>진행 중인 루틴이 없어요.<br>영상 탭에서 루틴을 시작해 보세요.</p><button class="primary" data-act="tab" data-tab="videos">영상 고르기</button></div></div>';
  }
  let done = 0, wkGoal = 0;
  list.forEach(v => { done += Math.min(weekCount(v.id), tgt(v)); wkGoal += tgt(v); });
  const todayCount = new Set(state.logs.filter(l => l.date === today).map(l => l.vid)).size;
  const left = wkGoal - done;
  let html = streakCard('<div style="text-align:right"><div class="big">' + done + '/' + wkGoal + '</div><div class="sub">이번 주' + (left > 0 ? '' : ' 달성') + '</div></div>');

  // 진행 중인 루틴은 모두 노출. 1: 할 것 / 2: 오늘 완료(주간 남음) / 3: 이번 주 달성·루틴 달성
  const items = list.map(v => {
    const left = tgt(v) - weekCount(v.id);
    const doneToday = doneOn(v.id, today);
    const routineDone = periodCount(v) >= goal(v);
    const state2 = routineDone ? '루틴 달성' : left <= 0 ? '이번 주 달성' : left + '회 남음';
    const todoNow = !doneToday && !routineDone && left > 0;
    const rank = todoNow ? 0 : (doneToday && !routineDone && left > 0) ? 1 : 2;
    return { v, left, rank, todoNow, routineDone, label: (doneToday ? '오늘 완료 ✓ · ' : '') + state2 };
  }).sort((a, b) => a.rank - b.rank || b.left - a.left);
  const anyTodo = items.some(x => x.todoNow);
  html += '<div class="card"><h2>진행 중인 루틴</h2>' + (anyTodo ? '' : '<p class="sub">오늘 할 건 다 했어요.</p>')
    + items.map((x, i) => '<div class="today-item" data-act="play" data-id="' + x.v.id + '">'
        + '<img class="thumb" src="' + thumb(x.v.id) + '" alt="">'
        + '<div class="grow"><div class="title">' + esc(x.v.title) + '</div><span class="badge' + (x.todoNow ? '' : ' mute') + '">' + x.label + '</span></div>'
        + (x.todoNow ? '<button class="small' + (i === 0 ? ' primary' : '') + '">시작</button>'
          : x.routineDone ? '<button class="small on" data-act="achieve" data-id="' + x.v.id + '">다음 정하기</button>'
          : '<button class="small checked" aria-label="' + (x.left > 0 ? '오늘 완료' : '이번 주 달성') + '">✓</button>') + '</div>').join('') + '</div>';

  html += '<div class="card"><div class="row-between"><h2>이번 주</h2><span class="sub">오늘 칸을 누르면 직접 체크</span></div>'
    + '<div class="days">' + w.map((d, i) => '<span class="' + (d === today ? 'now' : '') + '">' + DAY_NAMES[i] + '</span>').join('') + '</div>'
    + list.map(v => {
      const cells = w.map(d => {
        const on = state.logs.some(l => l.vid === v.id && l.date === d);
        const prev = on && v.run.from && d < v.run.from;
        return '<button class="cell' + (on ? ' on' : '') + (prev ? ' prev' : '') + (d === today ? ' today' : '') + (d > today ? ' future' : '') + '" data-act="toggle" data-id="' + v.id + '" data-date="' + d + '"'
          + (d !== today ? ' disabled' : '') + ' aria-label="' + d + (prev ? ' 완료 (이전 루틴)' : on ? ' 완료' : ' 미완료') + '">' + (on ? '✓' : '') + '</button>';
      }).join('');
      return '<div class="vrow"><div class="meta"><span class="title grow">' + esc(v.title) + '</span><span class="sub">' + weekCount(v.id) + '/' + tgt(v) + '</span></div><div class="cells">' + cells + '</div></div>';
    }).join('') + '</div>';
  return html;
}

function videoCard(v) {
  const line = periodLine(v);
  return '<div class="card vcard" data-act="detail" data-id="' + v.id + '"><div class="top">'
    + '<img class="thumb" src="' + thumb(v.id) + '" alt="">'
    + '<div class="grow"><div class="title2">' + esc(v.title) + '</div>'
    + (v.run ? '<div class="bar"><i style="width:' + Math.round(Math.min(1, periodCount(v) / goal(v)) * 100) + '%"></i></div>' : '')
    + '<div class="sub">' + (line ? line + ' · ' : '') + '누적 ' + totalCount(v.id) + '회</div></div>'
    + '<span class="chev" aria-hidden="true">›</span></div></div>';
}

function renderDetail() {
  const v = state.videos.find(x => x.id === detailId);
  const today = ymd(new Date());
  const pe = v.run ? periodEnd(v) : null;
  const ws = mondayOf(new Date());
  const lastPast = v.past.length ? v.past[v.past.length - 1] : null;
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const prefix = y + '-' + String(m + 1).padStart(2, '0') + '-';
  const dates = new Set(state.logs.filter(l => l.vid === v.id).map(l => l.date));
  const monthCount = [...dates].filter(d => d.startsWith(prefix)).length;
  const last = lastDate(v.id);
  const now = new Date();
  const isCurMonth = y === now.getFullYear() && m === now.getMonth();
  const blanks = (new Date(y, m, 1).getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  let cal = '';
  for (let i = 0; i < blanks; i++) cal += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const date = prefix + String(d).padStart(2, '0');
    const on = dates.has(date);

      + (date !== today ? ' disabled' : '') + ' aria-label="' + date + (on ? ' 완료' : ' 미완료') + '">' + d + '</button>';

  return '<button class="back" data-act="back">‹ 내 영상</button>'
    + '<div class="hero" data-act="play" data-id="' + v.id + '"><img src="' + thumb(v.id) + '" alt=""></div>'
    + '<div class="dtitle">' + esc(v.title) + '</div>'
    + '<button class="primary" style="width:100%;margin-bottom:14px" data-act="play" data-id="' + v.id + '">재생</button>'
    + (v.run
      ? '<div class="card"><h2>진행 중인 루틴</h2>'
        + '<div class="sub" style="margin-bottom:4px">' + md(v.run.start) + ' ~ ' + md(pe) + '</div>'
        + '<div class="row-between"><b>' + periodLine(v) + '</b></div><div class="bar"><i style="width:' + Math.round(Math.min(1, periodCount(v) / goal(v)) * 100) + '%"></i></div>'
        + (isAchieved(v)
          ? '<p class="sub" style="margin:10px 0">목표를 모두 채웠어요. 목표를 바꾸려면 새 루틴으로 다시 시작해 주세요.</p>'
            + '<button class="on" style="width:100%" data-act="achieve" data-id="' + v.id + '">다음 정하기</button></div>'
          : ''
    + '<div class="setrow"><span>주간 목표</span><span class="step"><button class="small" data-act="t-minus" data-id="' + v.id + '" aria-label="목표 줄이기">−</button>주 ' + tgt(v) + '회<button class="small" data-act="t-plus" data-id="' + v.id + '" aria-label="목표 늘리기">+</button></span></div>'
    + '<div class="setrow"><span>기간</span><span class="step"><button class="small" data-act="p-minus" data-id="' + v.id + '" aria-label="기간 줄이기">−</button>' + v.weeks + '주<button class="small" data-act="p-plus" data-id="' + v.id + '" aria-label="기간 늘리기">+</button></span></div>'
        + '<button style="width:100%;margin-top:10px" data-act="stop" data-id="' + v.id + '">루틴 그만하기</button></div>')
      : '<div class="card"><h2>' + (lastPast ? '다시 시작' : '루틴 시작') + '</h2>'
        + (lastPast ? '<div class="sub" style="margin-bottom:4px">지난 루틴 · ' + pastLine(lastPast) + ' (' + md(lastPast.start) + ' ~ ' + md(lastPast.end) + ')</div>' : '')
    + '<div class="setrow"><span>주간 목표</span><span class="step"><button class="small" data-act="t-minus" data-id="' + v.id + '" aria-label="목표 줄이기">−</button>주 ' + tgt(v) + '회<button class="small" data-act="t-plus" data-id="' + v.id + '" aria-label="목표 늘리기">+</button></span></div>'
    + '<div class="setrow"><span>기간</span><span class="step"><button class="small" data-act="p-minus" data-id="' + v.id + '" aria-label="기간 줄이기">−</button>' + v.weeks + '주<button class="small" data-act="p-plus" data-id="' + v.id + '" aria-label="기간 늘리기">+</button></span></div>'
        + '<p class="sub" style="margin:8px 0 10px"><b>총 ' + (v.target * v.weeks) + '회</b> · ' + md(ws) + ' ~ ' + md(addDays(ws, v.weeks * 7 - 1)) + '</p>'
        + '<button class="on" style="width:100%" data-act="start" data-id="' + v.id + '">' + (lastPast ? '다시 시작' : '루틴 시작') + '</button></div>')
    + '<div class="card"><h2>수행 이력</h2>'
    + '<div class="stats"><div class="stat"><span class="sub">지금까지</span><b>' + totalCount(v.id) + '회</b></div>'
    + '<div class="stat"><span class="sub">' + (m + 1) + '월</span><b>' + monthCount + '회</b></div>'
    + '<div class="stat"><span class="sub">최근</span><b>' + (last || '-') + '</b></div></div>'
    + '<div class="calhead"><button class="small" data-act="cal-prev" aria-label="이전 달">‹</button><span>' + y + '년 ' + (m + 1) + '월</span>'
    + '<button class="small" data-act="cal-next" aria-label="다음 달"' + (isCurMonth ? ' disabled' : '') + '>›</button></div>'
    + '<div class="days">' + DAY_NAMES.map(n => '<span>' + n + '</span>').join('') + '</div>'
    + '<div class="cal">' + cal + '</div>'
    + '<p class="sub" style="margin-top:10px">오늘 날짜만 직접 체크하거나 지울 수 있어요. 옅게 칠해진 날짜가 목표 기간이에요.</p></div>'
    + (v.run ? '<button class="danger" disabled style="opacity:.4">영상 삭제</button><p class="sub" style="text-align:center;margin-top:6px">진행 중인 루틴이 있으면 삭제할 수 없어요. 루틴을 그만한 뒤 삭제해 주세요.</p>'
      : '<button class="danger" data-act="remove" data-id="' + v.id + '">영상 삭제</button>');
}

function renderVideos() {
  let html = '';
  if (adding) {
    const ws = mondayOf(new Date());
    const full = routine().length >= MAX_ROUTINE;
    const startNow = !full && addStart !== false;
    html += '<div class="card"><h2>영상 추가</h2>'
      + '<input type="url" id="add-url" placeholder="https://youtu.be/..." autocomplete="off" value="' + esc(addUrl) + '">'
      + '<div class="err" id="add-err"></div>'
      + '<div class="setrow"><span>바로 루틴 시작</span><button class="small' + (startNow ? ' on' : '') + '" data-act="add-start" aria-pressed="' + startNow + '"' + (full ? ' disabled' : '') + '>' + (startNow ? '켜짐 ✓' : '꺼짐') + '</button></div>'
      + (startNow
        ? '<div class="setrow"><span>주간 목표</span><span class="step"><button class="small" data-act="minus" aria-label="목표 줄이기">−</button>주 ' + addTarget + '회<button class="small" data-act="plus" aria-label="목표 늘리기">+</button></span></div>'
          + '<div class="setrow"><span>기간</span><span class="step"><button class="small" data-act="w-minus" aria-label="기간 줄이기">−</button>' + addWeeks + '주<button class="small" data-act="w-plus" aria-label="기간 늘리기">+</button></span></div>'
          + '<p class="sub" style="margin:8px 0 14px"><b>총 ' + (addTarget * addWeeks) + '회</b> · ' + md(ws) + ' ~ ' + md(addDays(ws, addWeeks * 7 - 1)) + '</p>'
        : '<p class="sub" style="margin:8px 0 14px">' + (full ? '진행 중인 루틴이 5개라 보관함에 저장돼요.' : '보관함에 저장돼요. 루틴은 영상 상세에서 시작할 수 있어요.') + '</p>')
      + '<div class="actions"><button data-act="cancel-add">취소</button><button class="primary" data-act="submit-add">추가</button></div></div>';
  } else {
    html += '<button style="width:100%" class="' + (state.videos.length === 0 ? 'primary' : '') + '" data-act="open-add">+ 영상 추가</button>';
  }
  const on = routine(), off = state.videos.filter(v => !v.run);
  if (on.length) html += '<div class="section"><h2>진행 중인 루틴</h2><span class="sub">' + on.length + '/' + MAX_ROUTINE + '</span></div>' + on.map(videoCard).join('');
  if (off.length) html += '<div class="section"><h2>보관함</h2><span class="sub">' + off.length + '개</span></div>' + off.map(videoCard).join('');
  if (!state.videos.length && !adding) html += '<p class="sub" style="text-align:center;margin-top:16px">등록한 영상이 여기에 모여요.</p>';
  return html;
}

function render() {
  const w = weekDates();
  document.getElementById('week-range').textContent = w[0].slice(5).replace('-', '.') + ' ~ ' + w[6].slice(5).replace('-', '.');
  expire();
  if (detailId && !state.videos.some(x => x.id === detailId)) detailId = null;
  document.getElementById('week-range').hidden = !!detailId;
  document.getElementById('page-title').textContent = detailId ? '영상 상세' : tab === 'home' ? '운동 스탬프' : '내 영상';
  document.getElementById('nav-home').className = tab === 'home' ? 'cur' : '';
  document.getElementById('nav-videos').className = tab === 'videos' ? 'cur' : '';
  document.getElementById('view').innerHTML = detailId ? renderDetail() : tab === 'home' ? renderHome() : renderVideos();
}

async function submitAdd() {
  const input = document.getElementById('add-url');
  const err = document.getElementById('add-err');
  const id = parseId(input.value);
  if (!id) { err.textContent = '유튜브 링크를 확인해 주세요'; return; }
  if (state.videos.some(v => v.id === id)) { err.textContent = '이미 등록한 영상이에요'; return; }
  err.textContent = '';
  input.disabled = true;
  const title = await fetchTitle(id);
  const startNow = routine().length < MAX_ROUTINE && addStart !== false;
  const nv = { id, title, target: addTarget, weeks: addWeeks, run: null, past: [], addedAt: Date.now() };
  if (startNow) startRun(nv);
  state.videos.push(nv);
  save();
  adding = false; addTarget = 3; addWeeks = 4; addUrl = ''; addStart = null;
  render();
  toast(startNow ? '이번 주부터 ' + nv.weeks + '주 동안 시작해요' : '보관함에 저장했어요');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const v = id ? state.videos.find(x => x.id === id) : null;
  if (act === 'tab') {
    const go = () => { tab = el.dataset.tab; adding = false; render(); window.scrollTo(0, 0); };
    if (detailId) { afterBack = go; history.back(); } else go();
  }
  else if (act === 'detail') { history.pushState({ layer: 'detail' }, ''); detailId = id; const n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); render(); window.scrollTo(0, 0); }
  else if (act === 'back') history.back();
  else if (act === 'cal-prev' || act === 'cal-next') { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (act === 'cal-next' ? 1 : -1), 1); render(); }
  else if (act === 'go-add') { tab = 'videos'; adding = true; render(); document.getElementById('add-url').focus(); }
  else if (act === 'open-add') { adding = true; render(); document.getElementById('add-url').focus(); }
  else if (act === 'cancel-add') { adding = false; addUrl = ''; addStart = null; render(); }
  else if (act === 'add-start') { addStart = addStart === false; render(); }
  else if (act === 'minus' || act === 'plus') { addTarget = Math.min(7, Math.max(1, addTarget + (act === 'plus' ? 1 : -1))); render(); }
  else if (act === 'w-minus' || act === 'w-plus') { addWeeks = Math.min(12, Math.max(1, addWeeks + (act === 'w-plus' ? 1 : -1))); render(); }
  else if (act === 'submit-add') submitAdd();
  else if (act === 'play') openPlayer(id);
  else if (act === 'toggle') {
    const date = el.dataset.date;
    if (date !== ymd(new Date())) return;
    const has = state.logs.some(l => l.vid === id && l.date === date);
    if (has) {
      if (!confirm('오늘 스탬프를 지울까요?')) return;
      state.logs = state.logs.filter(l => !(l.vid === id && l.date === date)); save();
      render();
    } else {
      const was = v && isAchieved(v);
      addLog(id, 'manual', date);
      render();
      if (v && !was && isAchieved(v)) openAchieve(id);
    }
  }
  else if (act === 'start') {
    if (routine().length >= MAX_ROUTINE) { toast('루틴은 5개까지예요. 하나를 그만두고 시작해 주세요'); return; }
    startRun(v); save(); render();
    toast('이번 주부터 ' + v.weeks + '주 동안 시작해요');
  }
  else if (act === 'stop') {
    const achieved = periodCount(v) >= goal(v);
    if (!confirm('"' + v.title + '" 루틴을 그만할까요?\n' + (achieved ? '목표를 이미 채워서 "달성"으로 기록돼요.' : '지금까지의 결과(' + goal(v) + '회 중 ' + periodCount(v) + '회)는 남고, 다시 시작하면 처음부터 새로 시작해요.'))) return;
    endRun(v, 'stopped'); save(); render();
    toast(achieved ? '달성으로 기록했어요' : '루틴을 그만했어요');
  }
  else if (act === 't-minus' || act === 't-plus') {
    if (isAchieved(v)) return;
    v.target = Math.min(7, Math.max(1, tgt(v) + (act === 't-plus' ? 1 : -1)));
    if (v.run) for (let i = Math.max(0, weekIdx(v)); i < v.run.wt.length; i++) v.run.wt[i] = v.target;
    save(); render();
    if (isAchieved(v)) openAchieve(id);
  }
  else if (act === 'p-minus' || act === 'p-plus') {
    if (isAchieved(v)) return;
    const cur = v.run ? v.run.wt.length : v.weeks;
    const min = v.run ? weekIdx(v) + 1 : 1;
    const n = Math.min(12, Math.max(min, cur + (act === 'p-plus' ? 1 : -1)));
    if (n === cur && act === 'p-minus' && v.run) toast('이미 지난 주보다 짧게는 줄일 수 없어요');
    v.weeks = n;
    if (v.run) { while (v.run.wt.length < n) v.run.wt.push(v.target); v.run.wt.length = n; }
    save(); render();
    if (isAchieved(v)) openAchieve(id);
  }
  else if (act === 'achieve') openAchieve(id);
  else if (act === 'ach-later') history.back();
  else if (act === 'ach-archive' || act === 'ach-restart') {
    const aid = achieveId, av = state.videos.find(x => x.id === aid);
    afterBack = () => {
      if (!av || !isAchieved(av)) { render(); return; }
      endRun(av, 'stopped'); save();
      if (act === 'ach-restart' && detailId !== aid) {
        history.pushState({ layer: 'detail' }, ''); detailId = aid;
        const n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1);
      }
      render();
      if (act === 'ach-restart') window.scrollTo(0, 0);
      toast(act === 'ach-restart' ? '달성으로 기록했어요. 새 목표를 정해 주세요' : '달성으로 기록하고 보관함으로 옮겼어요');
    };
    history.back();
  }
  else if (act === 'remove') {
    if (v.run) return;
    if (!confirm('"' + v.title + '" 영상을 삭제할까요?\n운동한 기록과 연속 기록은 유지되고, 지난 루틴 결과는 사라져요.')) return;
    state.videos = state.videos.filter(x => x.id !== id);
    save();
    if (detailId) history.back(); else render();
  }
});

document.addEventListener('input', e => { if (e.target.id === 'add-url') addUrl = e.target.value; });

let player = null, ticker = null, session = null;
let apiReady = new Promise(res => { window.onYouTubeIframeAPIReady = res; });
function loadApi() {
  if (loadApi.done) return; loadApi.done = true;
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
}
function fmt(sec) { sec = Math.floor(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

async function openPlayer(id) {
  const v = state.videos.find(x => x.id === id);
  const already = doneOn(id, ymd(new Date()));
  session = { id, watched: 0, stamped: already };
  document.getElementById('p-title').textContent = v.title;
  document.getElementById('p-error').hidden = true;
  document.getElementById('p-link').href = 'https://www.youtube.com/watch?v=' + id;
  document.getElementById('p-progress').textContent = already ? '오늘 스탬프는 이미 찍었어요' : '80% 이상 보면 스탬프가 찍혀요';
  document.getElementById('p-bar').style.width = '0';
  document.getElementById('p-manual').hidden = already;
  history.pushState({ layer: 'player' }, '');
  document.getElementById('player-view').hidden = false;
  loadApi();
  await apiReady;
  if (!session || session.id !== id) return;
  player = new YT.Player('yt', {
    videoId: id, playerVars: { playsinline: 1, rel: 0 },
    events: {
      onStateChange: ev => {
        clearInterval(ticker);
        if (ev.data === YT.PlayerState.PLAYING) ticker = setInterval(tick, 1000);
        if (ev.data === YT.PlayerState.ENDED) stamp('auto');
      },
      onError: () => { document.getElementById('p-error').hidden = false; }
    }
  });
}
function tick() {
  if (!session || !player || !player.getDuration) return;
  const dur = player.getDuration();
  if (!dur) return;
  session.watched += 1;
  const ratio = Math.min(1, session.watched / dur);
  document.getElementById('p-bar').style.width = Math.round(ratio * 100) + '%';
  if (!session.stamped) document.getElementById('p-progress').textContent = '시청 ' + fmt(session.watched) + ' / ' + fmt(dur) + ' · 80% 이상 보면 스탬프가 찍혀요';
  if (ratio >= 0.8) stamp('auto');
}
function stamp(src) {
  if (!session || session.stamped) return;
  session.stamped = true;
  const v = state.videos.find(x => x.id === session.id);
  const was = isAchieved(v);
  addLog(session.id, src);
  if (!was && isAchieved(v)) session.achieved = true;
  const msg = v.run ? '스탬프 완료 · 이번 주 ' + weekCount(v.id) + '/' + tgt(v) : '스탬프 완료 · 누적 ' + totalCount(v.id) + '회';
  document.getElementById('p-progress').textContent = msg;
  document.getElementById('p-manual').hidden = true;
  render(); toast(msg);
}
function closePlayer() {
  clearInterval(ticker);
  if (player && player.destroy) player.destroy();
  const ach = session && session.achieved ? session.id : null;
  player = null; session = null;
  document.querySelector('.frame').innerHTML = '<div id="yt"></div>';
  document.getElementById('player-view').hidden = true;
  render();
  if (ach) setTimeout(() => openAchieve(ach), 0);
}

let achieveId = null;
function openAchieve(id) {
  const v = state.videos.find(x => x.id === id);
  if (!v || !isAchieved(v) || achieveId) return;
  achieveId = id;
  const pe = periodEnd(v), early = ymd(new Date()) < pe;
  document.getElementById('s-title').textContent = v.title;
  document.getElementById('s-line').textContent = periodCount(v) + '/' + goal(v) + '회 · ' + md(v.run.start) + ' ~ ' + md(pe)
    + (early ? ' · 다시 시작하거나 보관함으로 옮기면 남은 기간은 여기서 끝나요' : '');
  document.getElementById('sheet').hidden = false;
  history.pushState({ layer: 'sheet' }, '');
}
document.getElementById('p-close').addEventListener('click', () => history.back());

let afterBack = null;
window.addEventListener('popstate', () => {
  if (achieveId) { achieveId = null; document.getElementById('sheet').hidden = true; }
  else if (!document.getElementById('player-view').hidden) closePlayer();
  else if (detailId) { detailId = null; render(); }
  const f = afterBack; afterBack = null;
  if (f) f();
});
document.getElementById('p-manual').addEventListener('click', () => stamp('manual'));

save();
render();
</script>
</body>
</html>
